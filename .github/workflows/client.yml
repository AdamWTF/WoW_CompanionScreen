name: Client CI and Release

on:
  push:
    branches: [main]
    tags: ['client-v*']
    paths:
      - '.github/workflows/client.yml'
      - 'addon/**'
      - 'deps/**'
      - 'extensions/**'
      - 'include/**'
      - 'scripts/package-client-release.ps1'
      - 'scripts/validate-version.ps1'
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/client.yml'
      - 'addon/**'
      - 'deps/**'
      - 'extensions/**'
      - 'include/**'
      - 'scripts/package-client-release.ps1'
      - 'scripts/validate-version.ps1'
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build and test Win32 client
    runs-on: windows-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version and release state
        id: release
        run: |
          $package = Get-Content -Raw wcs-web/package.json | ConvertFrom-Json
          $version = [string]$package.version
          $tag = "client-v$version"
          $publish = $false

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tagMatch = [regex]::Match($env:GITHUB_REF_NAME, '^client-v(\d+\.\d+\.\d+)$')
            if (-not $tagMatch.Success) { throw "Client release tags must match client-vX.Y.Z." }
            $version = $tagMatch.Groups[1].Value
            $tag = $env:GITHUB_REF_NAME

            git fetch origin main:refs/remotes/origin/main
            git merge-base --is-ancestor $env:GITHUB_SHA origin/main
            if ($LASTEXITCODE -ne 0) { throw "Client releases must point to a commit on main." }
            $publish = $true
          } elseif ($env:GITHUB_REF -eq 'refs/heads/main') {
            git show-ref --verify --quiet "refs/tags/$tag"
            $publish = $LASTEXITCODE -ne 0
            $global:LASTEXITCODE = 0
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publish=$($publish.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version: $version; tag: $tag; publish: $publish"

      - name: Validate committed component versions
        run: ./scripts/validate-version.ps1 -Version '${{ steps.release.outputs.version }}'

      - name: Configure Win32 build
        run: cmake -S . -B build -A Win32

      - name: Build native components and tests
        run: cmake --build build --config Release --target wcs-core wcs-patcher wcs-gamepad wcs-bridge wcs-gamepad-tests wcs-gamepad-camera-view-tests wcs-gamepad-smart-interact-tests wcs-bridge-tests wcs-bridge-websocket-tests --parallel

      - name: Run native tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package release
        if: steps.release.outputs.publish == 'true'
        run: ./scripts/package-client-release.ps1 -Version '${{ steps.release.outputs.version }}'

      - name: Upload release assets
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: client-release-${{ steps.release.outputs.version }}
          path: |
            dist/wow-companion-screen-client-${{ steps.release.outputs.version }}.zip
            dist/wow-companion-screen-client-${{ steps.release.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish client release
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          name: client-release-${{ needs.build.outputs.version }}
          path: release

      - name: Create release tag if needed
        shell: bash
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" release/* \
            --verify-tag \
            --title "WoW Companion Screen Client v$VERSION" \
            --generate-notes
