# Builds the native components and companion web app, then publishes one installable bundle on every push to
# v1.1 (the current SDK line). The job runs the exact same commands a developer runs locally
# (test-ci-build.ps1 / build.ps1) -- nothing here knows anything the local build recipe does not, so a
# green run means the documented local build works, not that some parallel CI-only path does.
#
# d3d9.dll remains an optional development injection mechanism and is not part of the bundle: the
# supported install uses wcs-patcher.exe. No client binary (Wow.exe, patched or not) is published.
#
# Versioning is automatic and nothing has to be tagged by hand. SERIES is the only number anyone
# edits, and only when a release is worth calling a new one; the patch number is the commit count.
name: Build and Release

on:
  push:
    branches: [v1.1]
  pull_request:
    branches: [v1.1]
  workflow_dispatch:

permissions:
  contents: read

env:
  SERIES: '1.1'

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest

    outputs:
      version: ${{ steps.v.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The patch number is the commit count, which a shallow clone cannot produce.
          fetch-depth: 0

      - name: Work out the version
        id: v
        run: |
          $count   = [int](git rev-list --count HEAD)
          $release = $env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/v1.1'
          $version = if ($release) { "$env:SERIES.$count" } else { 'dev-' + $env:GITHUB_SHA.Substring(0, 7) }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host $version

      - name: Configure (Win32)
        run: cmake -S . -B build -A Win32

      - name: Build native components
        run: cmake --build build --config Release --target wcs-core wcs-patcher wcs-gamepad wcs-bridge wcs-gamepad-tests wcs-gamepad-smart-interact-tests wcs-bridge-tests wcs-bridge-websocket-tests --parallel

      - name: Test native components
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install web dependencies
        working-directory: wcs-web
        run: npm ci

      - name: Test and build web app
        working-directory: wcs-web
        run: |
          npm test
          npm run build

      - name: Stage release bundle
        run: |
          $bundle = "dist\wow-companion-screen-${{ steps.v.outputs.version }}"
          New-Item -ItemType Directory -Force -Path "$bundle\Extensions\wcs-gamepad", "$bundle\Extensions\wcs-bridge", "$bundle\Interface\AddOns", "$bundle\web" | Out-Null
          Copy-Item "build\Release\wcs-core.dll", "build\Release\wcs-patcher.exe" -Destination $bundle
          Copy-Item "build\Release\wcs-gamepad.dll", "extensions\wcs-gamepad\wcs-gamepad.cfg.example", "extensions\wcs-gamepad\gamecontrollerdb.txt", "extensions\wcs-gamepad\gamecontrollerdb.LICENSE.txt" -Destination "$bundle\Extensions\wcs-gamepad"
          Copy-Item "build\Release\wcs-bridge.dll", "extensions\wcs-bridge\wcs-bridge.cfg.example" -Destination "$bundle\Extensions\wcs-bridge"
          Copy-Item "addon\WoWCompanionScreen" -Destination "$bundle\Interface\AddOns" -Recurse
          Copy-Item "wcs-web\out\*" -Destination "$bundle\web" -Recurse
          Copy-Item "README.md", "NOTICE.md", "LICENSE" -Destination $bundle
          Compress-Archive -Path "$bundle\*" -DestinationPath "$bundle.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: wow-companion-screen-${{ steps.v.outputs.version }}
          path: dist/wow-companion-screen-${{ steps.v.outputs.version }}.zip
          if-no-files-found: error

  # Every push to v1.1 becomes a release, tag included. The tag is created by this job from the
  # version above rather than pushed by hand, and a tag created with GITHUB_TOKEN does not start
  # another run, so there is no loop to break.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/v1.1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wow-companion-screen-*
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: WoW Companion Screen v${{ needs.build.outputs.version }}
          body: Built from ${{ github.sha }}
          files: wow-companion-screen-${{ needs.build.outputs.version }}.zip
          generate_release_notes: true
          prerelease: false
