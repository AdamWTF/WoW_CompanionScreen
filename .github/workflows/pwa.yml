name: PWA CI and Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pwa.yml'
      - 'wcs-web/**'
      - 'scripts/validate-version.ps1'
      - '!wcs-web/*.md'
      - '!wcs-web/**/*.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pwa.yml'
      - 'wcs-web/**'
      - 'scripts/validate-version.ps1'
      - '!wcs-web/*.md'
      - '!wcs-web/**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build PWA
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate committed component versions
        shell: pwsh
        run: ./scripts/validate-version.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wcs-web/package-lock.json

      - name: Install dependencies
        working-directory: wcs-web
        run: npm ci

      - name: Run tests
        working-directory: wcs-web
        run: npm test

      - name: Type-check
        working-directory: wcs-web
        run: npm run typecheck

      - name: Build and verify GitHub Pages PWA
        working-directory: wcs-web
        env:
          NEXT_PUBLIC_BASE_PATH: /WoW_CompanionScreen
        run: |
          npm run build
          node scripts/verify-static-build.mjs /WoW_CompanionScreen
          touch out/.nojekyll

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: wcs-web/out

  pages:
    name: Deploy public PWA
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
